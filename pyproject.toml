[project]
name = "voiceobs"
version = "0.0.1"
description = "Voice Observability (VO) — the consumer side of the VAS↔VO seam. One call, one screen."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
pg = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic scaffolding + autogenerated migrations are boilerplate — don't lint.
extend-exclude = ["alembic"]

# core/ must stay pure: no I/O, no DB, no network. Enforced in CI.
# See CONTRACTS.md §"The whole of core, two pure functions".
[tool.importlinter]
root_package = "voiceobs"

[[tool.importlinter.contracts]]
name = "core is pure — must not import api, adapters, storage, worker, db"
type = "forbidden"
source_modules = ["voiceobs.core"]
forbidden_modules = [
    "voiceobs.api",
    "voiceobs.adapters",
    "voiceobs.storage",
    "voiceobs.worker",
    "voiceobs.db",
]
