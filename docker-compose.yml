# Local Pulse: Postgres + Redpanda (Kafka) + the three services (ingest / analysis / api).
# `docker compose up --build`, then point a producer's OTLP exporter at the ingest service.
#
# Port 8000 for the dashboard API, 8001 for ingest (OTLP). Redpanda is the ingest→analysis bus.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: voiceobs
      POSTGRES_PASSWORD: voiceobs
      POSTGRES_DB: voiceobs
    # NOT 5432: this machine already runs its own Postgres there.
    ports: ["${VO_DB_PORT:-5434}:5432"]
    volumes: ["voiceobs-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceobs -d voiceobs"]
      interval: 2s
      timeout: 3s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 30

  # create the topics once redpanda is healthy
  redpanda-init:
    image: redpandadata/redpanda:latest
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic create raw-spans -p 12 -X brokers=redpanda:9092 || true;
        rpk topic create raw-spans.dlq -p 1 -X brokers=redpanda:9092 || true;
        rpk topic create judge-requests -p 12 -X brokers=redpanda:9092 || true;
        rpk topic create judge-requests.backfill -p 12 -X brokers=redpanda:9092 || true;
        rpk topic create judge-requests.dlq -p 1 -X brokers=redpanda:9092 || true
    restart: "no"

  redis:
    image: redis:7-alpine
    ports: ["${VO_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # read/dashboard API (also owns migrations). All-in-one app is fine here.
  api:
    build: .
    command: ["uvicorn", "voiceobs.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]   # secrets/config: SECRET_KEY, LLM keys, telemetry, etc. (environment: overrides)
    environment:
      VOICEOBS_DATABASE_URL: postgresql+psycopg://voiceobs:voiceobs@db:5432/voiceobs
      VOICEOBS_REDIS_URL: redis://redis:6379   # auth abuse protection
    ports: ["${VO_PORT:-8000}:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # ingest service — thin Kafka producer, rewritten in Go (services/ingest). Speaks the same
  # raw-spans contract as the Python reference. DB URL is a pgx DSN (not the SQLAlchemy form).
  ingest:
    build: ./services/ingest
    environment:
      VOICEOBS_DATABASE_URL: postgres://voiceobs:voiceobs@db:5432/voiceobs
      VOICEOBS_KAFKA_BROKERS: redpanda:9092
      VOICEOBS_DEV_OPEN: "1"   # local compose: accept token-less pushes (P2 adds real token auth)
    ports: ["${VO_INGEST_PORT:-8001}:8000"]
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # analysis service — Kafka consumer. Scale it (`--scale analysis=3`); Kafka assigns partitions.
  analysis:
    build: .
    command: ["python", "-m", "voiceobs.worker"]
    env_file: [.env]
    environment:
      VOICEOBS_DATABASE_URL: postgresql+psycopg://voiceobs:voiceobs@db:5432/voiceobs
      VOICEOBS_KAFKA_BROKERS: redpanda:9092
      VOICEOBS_SKIP_MIGRATE: "1"
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # backfill worker — claims user-triggered BackfillJobs and analyses blob audio (audio-only).
  # Produces judge-requests, so it needs the broker.
  backfill:
    build: .
    command: ["python", "-m", "voiceobs.worker.backfill"]
    env_file: [.env]
    environment:
      VOICEOBS_DATABASE_URL: postgresql+psycopg://voiceobs:voiceobs@db:5432/voiceobs
      VOICEOBS_KAFKA_BROKERS: redpanda:9092
      VOICEOBS_BACKFILL_INTERVAL_S: "5"
      VOICEOBS_SKIP_MIGRATE: "1"
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # poller worker — pull-path ingest for file-based producers with no OTLP exporter. Sweeps each
  # storage_polling agent's store on an interval, discovers settled artifacts via its integration
  # manifest, and analyses new calls. Produces judge-requests, so it needs the broker.
  poller:
    build: .
    command: ["python", "-m", "voiceobs.worker.poller"]
    env_file: [.env]
    environment:
      VOICEOBS_DATABASE_URL: postgresql+psycopg://voiceobs:voiceobs@db:5432/voiceobs
      VOICEOBS_KAFKA_BROKERS: redpanda:9092
      VOICEOBS_POLLER_INTERVAL_S: "30"
      VOICEOBS_SKIP_MIGRATE: "1"
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # judge worker — drains the judge queue and runs the LLM judge at a bounded rate. Scale it
  # (`--scale judge=N`) to raise throughput; realtime is drained before backfill. Needs the per-role
  # LLM API keys in the environment (VOICEOBS_POST_CALL_API_KEY, VOICEOBS_FAILURE_ANALYSIS_API_KEY).
  judge:
    build: .
    command: ["python", "-m", "voiceobs.worker.judge"]
    env_file: [.env]
    environment:
      VOICEOBS_DATABASE_URL: postgresql+psycopg://voiceobs:voiceobs@db:5432/voiceobs
      VOICEOBS_KAFKA_BROKERS: redpanda:9092
      VOICEOBS_SKIP_MIGRATE: "1"
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  voiceobs-pg:
